name: Publiceren

# Bouwt de site en zet ze op GitHub Pages bij elke push naar main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nooit twee publicaties tegelijk; een lopende publicatie wordt afgewerkt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Website bouwen
        run: npm run build

      - name: GitHub Pages voorbereiden
        uses: actions/configure-pages@v5

      - name: Gebouwde website klaarzetten
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicatie.outputs.page_url }}
    steps:
      - name: Publiceren op GitHub Pages
        id: publicatie
        uses: actions/deploy-pages@v4
