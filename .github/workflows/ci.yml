name: Controles

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Browser voor Playwright installeren
        run: npx playwright install --with-deps chromium

      - name: Code controleren
        run: npm run lint

      - name: Tests voor de werking
        run: npm test

      - name: Tests met de echte app
        run: npm run test:e2e

      - name: Website bouwen
        run: npm run build

      - name: Playwright-rapport bewaren bij een fout
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
